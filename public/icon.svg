<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#31105C"/>
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="230" r="140" fill="#6366F1" opacity="0.25" filter="url(#glow)"/>

  <!-- CELLA Petals Lotus Iconography -->
  <g transform="translate(256, 215) scale(2.2)">
    <!-- Left Petal -->
    <path d="M 0 -45 C -40 -35 -55 5 -20 38 C -10 20 0 0 0 -45 Z" fill="url(#petalGrad1)" opacity="0.9"/>
    
    <!-- Right Petal -->
    <path d="M 0 -45 C 40 -35 55 5 20 38 C 10 20 0 0 0 -45 Z" fill="url(#petalGrad2)" opacity="0.9"/>
    
    <!-- Center Droplet / Heart Petal -->
    <path d="M 0 -50 C -25 -20 -18 20 0 45 C 18 20 25 -20 0 -50 Z" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Center Sparkle / Diamond -->
    <circle cx="0" cy="5" r="5" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- Typography: CELLA -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">CELLA</text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#A5B4FC" text-anchor="middle" letter-spacing="4">BEAUTY &amp; ACADEMY</text>
</svg>
